[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-tracker"
version = "0.1.0"
description = "Track and classify active applications for productivity insights"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "python-socketio[client]>=5.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
tracker = "tracker.main:app"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
